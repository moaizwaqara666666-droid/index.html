<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    var hash = window.location.hash;
    if (hash) {
      window.location.href = window.location.origin + window.location.pathname + "#" + hash.substring(1);
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
